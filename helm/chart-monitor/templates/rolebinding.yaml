apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart-monitor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chart-monitor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
