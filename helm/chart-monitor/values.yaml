nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# ---------------------------------------------------------------------------
# Single workload — backend serves the frontend static files
# ---------------------------------------------------------------------------
image:
  repository: "chart-monitor"
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

env: []
extraEnvFrom: []

service:
  type: ClusterIP
  port: 8000

probes:
  liveness:
    httpGet:
      path: /api/v1/dashboards
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    httpGet:
      path: /api/v1/dashboards
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

# ---------------------------------------------------------------------------
# Networking — Ingress (on-prem Kubernetes)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  annotations: {}
  host: "chart-monitor.local"
  tls: []

# ---------------------------------------------------------------------------
# Networking — OpenShift Route
# ---------------------------------------------------------------------------
openshift:
  enabled: false
  route:
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# Application configuration (non-sensitive → ConfigMap)
# ---------------------------------------------------------------------------
app:
  pollInterval: "30"       # CHART_MONITOR_POLL_INTERVAL
  maxData: "500"           # CHART_MONITOR_MAX_DATA
  storeDir: "/data/store"  # CHART_MONITOR_STORE_DIR / GIT_TARGET_PATH

# ---------------------------------------------------------------------------
# GitOps configuration
# ---------------------------------------------------------------------------
gitops:
  # Connection method: ssh | http-token | http-user-token
  connection: ssh

  # ── SSH connection ──────────────────────────────────────────────────────────
  ssh:
    # SSH clone URL (e.g. git@github.com:your-org/scripts.git)
    url: ""
    # Mount path inside the container where the ssh-key Secret file is available
    keyMountPath: "/app/secrets"

  # ── HTTP token connection ───────────────────────────────────────────────────
  # Token is supplied via the Kubernetes Secret key: GIT_HTTP_TOKEN
  httpToken:
    # HTTPS clone URL (e.g. https://github.com/your-org/repo.git)
    url: ""

  # ── HTTP username + token connection ───────────────────────────────────────
  # Token is supplied via the Kubernetes Secret key: GIT_HTTP_TOKEN
  httpUserToken:
    # HTTPS clone URL (e.g. https://gitlab.company.internal/org/repo.git)
    url: ""
    # Username (non-sensitive — set here in values, not in Secret)
    username: ""

  # Set to true to bypass certificate/host-key verification.
  # SSH method: disables SSH StrictHostKeyChecking.
  # HTTP methods: disables TLS certificate verification.
  # Only use on trusted internal networks.
  skipVerify: false

# ---------------------------------------------------------------------------
# Secrets — reference an existing Kubernetes Secret by name.
# SSH method:             SYNC_SECRET, ssh-key (PEM private key)
# http-token method:      SYNC_SECRET, GIT_HTTP_TOKEN
# http-user-token method: SYNC_SECRET, GIT_HTTP_TOKEN
# Optional:               any API tokens your collectors need (e.g. GITHUB_TOKEN)
# Defaults to the chart fullname if left empty.
# ---------------------------------------------------------------------------
existingSecret: ""

# ---------------------------------------------------------------------------
# Persistence — PVC is ALWAYS created
# ---------------------------------------------------------------------------
persistence:
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

# ---------------------------------------------------------------------------
# ServiceAccount & RBAC
# ---------------------------------------------------------------------------
serviceAccount:
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
